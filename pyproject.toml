[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-shards"
version = "0.0.1"
description = "Optional split deployment and horizontal sharding for Evennia, via configuration."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
dependencies = [
    "evennia",
    "django-multitenant",
    # macOS only. Apple's /usr/lib/libsqlite3.dylib runs sqlite3_initialize()
    # through libdispatch, which cannot survive the fork twistd uses to
    # daemonize — so `evennia start` hangs silently on the child's first
    # SQLite call. sqlean ships a statically-linked SQLite, so Apple's library
    # is never loaded. The marker means pip skips it everywhere else.
    # See docs/deployment-topology.md § macOS.
    "sqlean.py; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_shards*"]
