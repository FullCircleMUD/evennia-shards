[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evennia-shards"
version = "0.1.2"
description = "Optional split deployment and horizontal sharding for Evennia, via configuration."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Tim Baird"}]
requires-python = ">=3.10"
keywords = ["evennia", "mud", "sharding", "scaling", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Multi-User Dungeons (MUD)",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "evennia",
    "django-multitenant",
    # macOS only. Apple's /usr/lib/libsqlite3.dylib runs sqlite3_initialize()
    # through libdispatch, which cannot survive the fork twistd uses to
    # daemonize — so `evennia start` hangs silently on the child's first
    # SQLite call. sqlean ships a statically-linked SQLite, so Apple's library
    # is never loaded. The marker means pip skips it everywhere else.
    # See docs/deployment-topology.md § macOS.
    "sqlean.py; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/FullCircleMUD/evennia-shards"
Repository = "https://github.com/FullCircleMUD/evennia-shards"
Issues = "https://github.com/FullCircleMUD/evennia-shards/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evennia_shards*"]

# packages.find discovers directories containing __init__.py, so static/ is
# never a candidate and the webclient JS ships in no wheel without this.
# The failure is silent all the way to runtime: the build succeeds, pip
# installs, the app imports, the middleware injects the <script> tag — and
# the browser 404s on it, so cross-shard redirects never fire.
#
# Editable installs resolve the package to the source tree, where the file
# is present, so no local setup or test run can catch it. Verify against the
# built artifact instead:
#     python -m build && python -c "import zipfile;print(*zipfile.ZipFile('dist/evennia_shards-<v>-py3-none-any.whl').namelist(),sep='\n')"
[tool.setuptools.package-data]
evennia_shards = ["static/**/*"]
